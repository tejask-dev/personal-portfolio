<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Published study: authorship, sample and recognition</title><desc id="d">Original evidence summary. Tejas Kaushik, Liyona Wang, Shikai Jin and Elijah Murtagh co-authored the national first-place study in the 2025 Youreka Canada Journal. The sample spans 34 Sub-Saharan African countries. Association does not establish causation.</desc><rect width="1200" height="800" fill="#f3efdf"/><g fill="#17424a"><text x="70" y="73" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">YOUREKA CANADA JOURNAL / 2025</text><path d="M70 100h1060" stroke="#9cb1a6"/><text x="70" y="207" font-family="Georgia,serif" font-size="65">34 countries.</text><text x="70" y="281" font-family="Georgia,serif" font-style="italic" font-size="65">One careful question.</text><text x="73" y="336" font-family="Arial,sans-serif" font-size="22">Adolescent fertility and pediatric HIV treatment coverage</text><text x="73" y="368" font-family="Arial,sans-serif" font-size="22">in Sub-Saharan Africa.</text><rect x="73" y="417" width="485" height="118" fill="#dce6d8"/><text x="96" y="455" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">TEAM RECOGNITION</text><text x="96" y="501" font-family="Georgia,serif" font-size="35">National first-place study</text><text x="630" y="449" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">INTERPRETATION</text><text x="630" y="495" font-family="Georgia,serif" font-size="35">Association ≠ causation</text><path d="M70 581h1060" stroke="#9cb1a6"/><text x="73" y="619" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">AUTHORS AS LISTED IN THE FINAL JOURNAL</text><text x="73" y="661" font-family="Georgia,serif" font-size="26">Tejas Kaushik · Liyona Wang · Shikai Jin · Elijah Murtagh</text><text x="73" y="733" font-family="Arial,sans-serif" font-size="17">Original evidence summary / Final journal PDF pages 4–5 / Read the source alongside this case</text></g></svg>
